services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gigcast
      POSTGRES_USER: gigcast
      POSTGRES_PASSWORD: gigcast
    volumes:
      - gigcast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gigcast -d gigcast']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gigcast_pgdata:
